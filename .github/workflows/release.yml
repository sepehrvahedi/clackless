name: Release

# Push a tag like v0.1.0 to build the Python package and standalone binaries
# for Windows, macOS and Linux, test them, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ls dist/*-${GITHUB_REF_NAME#v}-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: clackless.exe }
          - { os: macos-latest, name: macos-arm64, exe: clackless }
          - { os: ubuntu-22.04, name: linux-x64, exe: clackless }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install . pyinstaller
      - run: pyinstaller --onefile --name clackless --collect-data clackless --collect-binaries onnxruntime scripts/pyinstaller_entry.py
      - name: Smoke-test the binary
        shell: bash
        run: |
          ./dist/${{ matrix.exe }} --version
          ./dist/${{ matrix.exe }} selftest --no-tts --duration 6
      - name: Archive
        shell: bash
        run: |
          mkdir pkg && cp dist/${{ matrix.exe }} README.md LICENSE pkg/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a clackless-${{ matrix.name }}.zip ./pkg/*
          else
            tar -czf clackless-${{ matrix.name }}.tar.gz -C pkg .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: clackless-${{ matrix.name }}.*

  github-release:
    needs: [package, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  # Optional: set the repository variable PUBLISH_TO_PYPI=true and configure
  # PyPI "trusted publishing" for this repo to publish `pip install clackless`.
  pypi:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
