name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # PortAudio for sounddevice, and a real text-to-speech voice so the
      # effectiveness tests also run on natural-sounding speech.
      # (macOS uses `say`, Windows uses the built-in SAPI voice.)
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit, effectiveness and CLI tests
        run: pytest --cov=clackless --cov-report=term-missing --cov-fail-under=85

      - name: Self-test (acceptance criteria) with audible before/after files
        run: clackless selftest --save selftest-audio

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: selftest-audio-${{ matrix.os }}
          path: selftest-audio/
